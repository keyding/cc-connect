name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run performance benchmarks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Use the released binary: building this linter requires Go 1.26,
      # while the project's supported Go version is still defined in go.mod.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          install-only: true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub workflows
        run: actionlint -color

      - name: Lint code
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          golangci-lint config verify
          # Preserve incremental linting while upstream lint debt is still present.
          if ! git cat-file -e "${LINT_BASE}^{commit}" 2>/dev/null; then
            LINT_BASE="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$LINT_BASE" ]; then
            golangci-lint run --new-from-rev="$LINT_BASE" ./...
          else
            golangci-lint run ./...
          fi

  unit-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all retained packages
        run: go build ./...

      - name: Verify module checksums
        run: go mod verify

      - name: Build default Telegram binary
        run: make build

      - name: Run all tests with race detector
        run: go test -race ./...

      - name: Run smoke and regression tests
        if: runner.os == 'Linux'
        run: go test -tags=smoke,regression ./tests/e2e/...

      - name: Run performance benchmarks
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.benchmarks
        run: go test -run='^$' -bench=. -benchmem -tags=performance ./tests/performance/...
