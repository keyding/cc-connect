# Telegram + Claude Code / Codex
# Copy to config.toml, set the environment variables, and use an existing work_dir.
# 复制为 config.toml，设置环境变量，并填写已存在的项目路径。
# Complete upstream options: docs/config.full.example.toml
language = "zh"

[log]
level = "info"

[[projects]]
name = "claude-project"

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "/path/to/project"
mode = "default"

[[projects.platforms]]
type = "telegram"

[projects.platforms.options]
# reply_to_trigger = false # Reply to the triggering message / 引用触发消息
token = "${TELEGRAM_BOT_TOKEN}"
allow_from = "${TELEGRAM_ALLOW_FROM}" # Telegram numeric user IDs, comma-separated

# To use Codex instead, change agent type above to "codex" and mode to "suggest".
# 使用 Codex：将上面的 agent type 改为 "codex"，mode 改为 "suggest"。
# To run both, uncomment this project and use a DIFFERENT bot token.
# 同时运行两个 agent：取消下方注释，并使用另一个 Bot Token，避免重复轮询。
#
# [[projects]]
# name = "codex-project"
#
# [projects.agent]
# type = "codex"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# mode = "suggest"
#
# [[projects.platforms]]
# type = "telegram"
#
# [projects.platforms.options]
# token = "${CODEX_TELEGRAM_BOT_TOKEN}"
# allow_from = "${TELEGRAM_ALLOW_FROM}"
