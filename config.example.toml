# Telegram + Claude Code / Codex
# Copy to config.toml, set the environment variables, and use an existing work_dir.
# 复制为 config.toml，设置环境变量，并填写已存在的项目路径。
# Complete upstream options: docs/config.full.example.toml
language = "zh"
# Directory preview requires a NEW data_dir; see docs/shared-session-directory.md.
# data_dir = "/absolute/path/to/cc-connect-directory-preview"

[log]
level = "info"

[[projects]]
name = "claude-project"

[projects.agent]
type = "claudecode"

[projects.agent.options]
work_dir = "/path/to/project"
mode = "default"

[[projects.platforms]]
type = "telegram"

[projects.platforms.options]
# shared_session_directory = false # Opt-in shared directory, durable queue and explicit controls; see docs/shared-session-directory.md
# share_session_in_channel = false # false: each user per Topic; true: common selection per Topic
# enable_reactions = false # React to incoming messages / 收到消息时添加回应
# reaction_emoji = "👀" # Default when omitted or blank; use a Telegram-supported reaction enabled in your chat / 默认 👀，需群组允许该回应
# reply_to_trigger = false # Reply to the triggering message / 引用触发消息
token = "${TELEGRAM_BOT_TOKEN}"
allow_from = "${TELEGRAM_ALLOW_FROM}" # Telegram numeric user IDs, comma-separated

# To use Codex instead, change agent type above to "codex" and mode to "suggest".
# Codex exec (default) has no interactive approval IPC; use backend = "app_server"
# in agent.options for local interactive approvals. / 本地交互审批需 app_server。
# 使用 Codex：将上面的 agent type 改为 "codex"，mode 改为 "suggest"。
# To run both, uncomment this project and use a DIFFERENT bot token.
# 同时运行两个 agent：取消下方注释，并使用另一个 Bot Token，避免重复轮询。
#
# [[projects]]
# name = "codex-project"
#
# [projects.agent]
# type = "codex"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# mode = "suggest"
# backend = "app_server" # Optional local interactive approvals; default is exec
#
# [[projects.platforms]]
# type = "telegram"
#
# [projects.platforms.options]
# shared_session_directory = true # Requires the independent new data_dir above
# share_session_in_channel = false
# token = "${CODEX_TELEGRAM_BOT_TOKEN}"
# allow_from = "${TELEGRAM_ALLOW_FROM}"

# Optional progress controls (also supported under [projects.display]):
# [display]
# tool_messages = false
# shared_acceptance_messages = false # Keep queue/pause notices, hide immediate acceptance receipts.
